<div [class]="wrapperClass()">
  @if (showPrefix()) {
    <span class="sportbook6vn-affix-input__affix sportbook6vn-affix-input__affix--prefix">
      @if (mode() === 'both') {
        <span class="sportbook6vn-affix-input__icon" aria-hidden="true">
          <svg viewBox="0 0 20 20">
            <path d="M4.5 4.5H14.5V15.5H6.3C5.3 15.5 4.5 14.7 4.5 13.7V4.5Z" />
            <path d="M8 7.4H12" />
            <path d="M8 10H12" />
            <path d="M6 15.5V6.3C6 5.3 6.8 4.5 7.8 4.5H15.5" />
          </svg>
        </span>
      } @else {
        <span class="sportbook6vn-affix-input__text">{{ prefixText() }}</span>
      }
    </span>
  }

  <div class="sportbook6vn-affix-input__content">
    <input
      class="sportbook6vn-affix-input__native"
      [attr.id]="inputId()"
      type="text"
      [attr.placeholder]="placeholder()"
      [disabled]="disabled()"
      [value]="value()"
      (input)="onInput($event)"
    />
  </div>

  @if (showSuffix()) {
    <span class="sportbook6vn-affix-input__affix sportbook6vn-affix-input__affix--suffix">
      @if (mode() === 'both') {
        <span class="sportbook6vn-affix-input__icon" aria-hidden="true">
          <svg viewBox="0 0 20 20">
            <circle cx="10" cy="10" r="6.2" />
            <path d="M10 8.1L10 8.2" />
            <path d="M10 10.2V13.5" />
          </svg>
        </span>
      } @else {
        <span class="sportbook6vn-affix-input__text">{{ suffixText() }}</span>
      }
    </span>
  }
</div>
