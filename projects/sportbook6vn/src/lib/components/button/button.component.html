<button
  nz-button
  [nzLoading]="loading()"
  [nzShape]="zorroShape()"
  [nzSize]="zorroSize()"
  [nzType]="zorroType()"
  [attr.aria-busy]="loading() ? 'true' : null"
  [attr.aria-label]="ariaLabel()"
  [attr.type]="type()"
  [class]="buttonClass()"
  [disabled]="isDisabled()"
  (click)="onClick($event)"
>
  <span class="sportbook6vn-button__icon" aria-hidden="true">
    <ng-content select="[sportbook6vnButtonStartIcon]" />
  </span>

  <span class="sportbook6vn-button__label">
    <ng-content />
  </span>

  <span class="sportbook6vn-button__icon" aria-hidden="true">
    <ng-content select="[sportbook6vnButtonEndIcon]" />
  </span>
</button>
