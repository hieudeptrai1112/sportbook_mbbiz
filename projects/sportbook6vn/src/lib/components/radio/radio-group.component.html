<div [class]="wrapperClass()" role="radiogroup">
  @for (option of options(); track option.value) {
    <sportbook6vn-radio
      [name]="name()"
      [value]="option.value"
      [label]="option.label"
      [checked]="isChecked(option)"
      [disabled]="disabled() || !!option.disabled"
      (select)="selectOption(option)"
    />
  }
</div>
