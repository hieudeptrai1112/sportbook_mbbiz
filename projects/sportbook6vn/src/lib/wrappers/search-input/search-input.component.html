<div [class]="wrapperClass()">
  <div class="sportbook6vn-search-input__content">
    <input
      class="sportbook6vn-search-input__native"
      [attr.id]="inputId()"
      [attr.placeholder]="placeholder()"
      [disabled]="disabled()"
      [value]="value()"
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
    />
  </div>

  @if (showClear()) {
    <button
      type="button"
      class="sportbook6vn-search-input__icon sportbook6vn-search-input__icon--clear"
      aria-label="Clear search value"
      (click)="clear()"
    >
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M6 6L14 14" />
        <path d="M14 6L6 14" />
      </svg>
    </button>
  }

  <span class="sportbook6vn-search-input__icon sportbook6vn-search-input__icon--search" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="5.5" />
      <path d="M16 16L20 20" />
    </svg>
  </span>
</div>
