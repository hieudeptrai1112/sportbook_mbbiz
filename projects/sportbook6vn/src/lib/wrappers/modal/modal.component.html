<div class="sportbook6vn-modal">
  <div class="sportbook6vn-modal__header">
    <h3 class="sportbook6vn-modal__title">{{ title() }}</h3>

    @if (showClose()) {
      <button
        type="button"
        class="sportbook6vn-modal__close"
        [attr.aria-label]="closeAriaLabel()"
        (click)="emitCloseAction()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 7L17 17" />
          <path d="M17 7L7 17" />
        </svg>
      </button>
    }
  </div>

  <div class="sportbook6vn-modal__body">
    <div class="sportbook6vn-modal__field">
      <sportbook6vn-input
        inputId="sportbook6vn-modal-field-1"
        [label]="firstFieldLabel()"
        [placeholder]="firstFieldPlaceholder()"
        [value]="firstFieldValue()"
        (valueChange)="onFirstFieldValueChange($event)"
      />
    </div>

    @if (showSecondField()) {
      <div class="sportbook6vn-modal__field">
        <sportbook6vn-input
          inputId="sportbook6vn-modal-field-2"
          [label]="secondFieldLabel()"
          [placeholder]="secondFieldPlaceholder()"
          [value]="secondFieldValue()"
          (valueChange)="onSecondFieldValueChange($event)"
        />
      </div>
    }

    <ng-content />
  </div>

  <div class="sportbook6vn-modal__footer">
    @if (actionLayout() === 'single') {
      <div class="sportbook6vn-modal__actions-single">
        <sportbook6vn-button
          shape="pill"
          size="lg"
          (buttonClick)="emitPrimaryAction()"
        >
          {{ primaryButtonLabel() }}
        </sportbook6vn-button>
      </div>
    } @else {
      <div class="sportbook6vn-modal__actions sportbook6vn-modal__actions--double">
        @if (shouldShowSecondaryAction()) {
          <sportbook6vn-button
            variant="secondary"
            shape="pill"
            size="lg"
            (buttonClick)="emitSecondaryAction()"
          >
            {{ secondaryButtonLabel() }}
          </sportbook6vn-button>
        }

        <sportbook6vn-button
          shape="pill"
          size="lg"
          (buttonClick)="emitPrimaryAction()"
        >
          {{ primaryButtonLabel() }}
        </sportbook6vn-button>
      </div>
    }
  </div>
</div>
