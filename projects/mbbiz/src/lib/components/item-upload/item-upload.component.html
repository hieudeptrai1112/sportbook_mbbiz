<div [class]="itemClass()" (drop)="onDrop($event)" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)">
  <div class="mbbiz-item-upload__dropzone">
    <span class="mbbiz-item-upload__content">
      <img class="mbbiz-item-upload__illustration" [src]="illustrationSrc()" alt="" aria-hidden="true" />

      <span class="mbbiz-item-upload__body">
        <span class="mbbiz-item-upload__guide">{{ uploadText() }}</span>
        <span class="mbbiz-item-upload__actions">
          <button
            type="button"
            class="mbbiz-item-upload__link"
            [disabled]="disabled()"
            (click)="selectFile($event)"
          >
            {{ selectText() }}
          </button>

          @if (showDataSource()) {
            <span class="mbbiz-item-upload__or">hoặc</span>
            <button
              type="button"
              class="mbbiz-item-upload__link mbbiz-item-upload__link--small"
              [disabled]="disabled()"
              (click)="emitDataSourceClick($event)"
            >
              {{ dataSourceText() }}
            </button>
          }
        </span>
      </span>
    </span>
  </div>

  @if (state() === 'error' && errorMessage()) {
    <div class="mbbiz-item-upload__error-message">
      <span class="mbbiz-item-upload__error-icon" aria-hidden="true">!</span>
      <span>{{ errorMessage() }}</span>
    </div>
  }
</div>
