<div [class]="wrapperClass()">
  <div class="mbbiz-password-input__stack">
    @if (showTitle()) {
      <label class="mbbiz-password-input__title" [attr.for]="inputId()">
        {{ label() }}
      </label>
    }

    <div class="mbbiz-password-input__field">
      <div class="mbbiz-password-input__text-wrap">
        <input
          class="mbbiz-password-input__native"
          [attr.id]="inputId()"
          [attr.placeholder]="showTitle() ? '' : placeholder()"
          [attr.type]="nativeType()"
          [disabled]="disabled()"
          [value]="modelValue()"
          (input)="onInput($event)"
          (focus)="onFocus()"
          (blur)="onBlur()"
        />
      </div>

      <button
        type="button"
        class="mbbiz-password-input__toggle"
        [disabled]="disabled()"
        [attr.aria-label]="toggleAriaLabel()"
        (click)="toggleVisibility()"
      >
        @if (!actualVisible()) {
          <svg class="mbbiz-password-input__icon mbbiz-password-input__icon--hide" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M2.5 10s2.5-4.2 7.5-4.2S17.5 10 17.5 10s-2.5 4.2-7.5 4.2S2.5 10 2.5 10Z" />
            <path d="M10 12.3a2.3 2.3 0 1 0 0-4.6 2.3 2.3 0 0 0 0 4.6Z" />
            <path d="M4 16 16 4" />
          </svg>
        } @else {
          <svg class="mbbiz-password-input__icon mbbiz-password-input__icon--unhide" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.5 12s3-5 9.5-5 9.5 5 9.5 5-3 5-9.5 5-9.5-5-9.5-5Z" />
            <circle cx="12" cy="12" r="3.2" />
          </svg>
        }
      </button>
    </div>
  </div>
</div>
