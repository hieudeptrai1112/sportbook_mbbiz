<div [class]="wrapperClass()">
  <label class="sportbook6vn-floating-label-input__label" [attr.for]="inputId()">
    {{ label() }}
  </label>

  <input
    nz-input
    class="sportbook6vn-floating-label-input__native"
    [attr.id]="inputId()"
    [attr.placeholder]="placeholder()"
    [disabled]="disabled()"
    [value]="value()"
    (input)="onInput($event)"
  />
</div>
