<div class="{{ classes() }}" [style.width.px]="width()">
  <div class="ds-input-password__stack">
    @if (showTitle()) {
      <span class="ds-input-password__title">{{ title() }}</span>
    }

    <div class="ds-input-password__field">
      <div class="ds-input-password__text-wrap">
        @if (interactive()) {
          <input
            class="ds-input-password__native"
            [type]="nativeType()"
            [value]="nativeValue()"
            [attr.placeholder]="title()"
            (input)="onInput($event)"
            (focus)="onFocus()"
            (blur)="onBlur()"
          />
        } @else {
          <span class="{{ textClass() }}">{{ displayText() }}</span>
          @if (showCursor()) {
            <span class="ds-input-password__cursor" aria-hidden="true">|</span>
          }
        }
      </div>

      <button
        type="button"
        class="ds-input-password__toggle"
        [disabled]="isToggleDisabled()"
        [attr.aria-label]="toggleAriaLabel()"
        (click)="toggleContentMode()"
      >
        @if (actualContentMode() === 'hide') {
          <svg class="ds-input-password__icon ds-input-password__icon--hide" viewBox="0 0 20 20" aria-hidden="true">
            <path
              d="M2.5 10s2.5-4.2 7.5-4.2S17.5 10 17.5 10s-2.5 4.2-7.5 4.2S2.5 10 2.5 10Z"
            />
            <path d="M10 12.3a2.3 2.3 0 1 0 0-4.6 2.3 2.3 0 0 0 0 4.6Z" />
            <path d="M4 16 16 4" />
          </svg>
        } @else {
          <svg class="ds-input-password__icon ds-input-password__icon--unhide" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M2.5 12s3-5 9.5-5 9.5 5 9.5 5-3 5-9.5 5-9.5-5-9.5-5Z"
            />
            <circle cx="12" cy="12" r="3.2" />
          </svg>
        }
      </button>
    </div>
  </div>
</div>
