<div class="{{ classes() }}">
  <div class="ds-input-basic__content">
    @if (isTypingState()) {
      <span class="{{ textClass() }}">{{ value() }}</span>
      <span class="ds-input-basic__cursor" aria-hidden="true">|</span>
    } @else {
      @if (displayValue()) {
        <span class="{{ textClass() }}">{{ displayValue() }}</span>
      }
      @if (showCursor()) {
        <span class="ds-input-basic__cursor" aria-hidden="true">|</span>
      }
    }
  </div>
</div>
